spring.application.name=backend

# PostgreSQL Connection Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/viewo}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Secret should be at least 256 bits)
jwt.secret=${JWT_SECRET:4f7a9d3e8b1c5f6a2b8e3d9f1c4a7e2b6d8f5c9a1e3b7d5f9c2a8e4b6d1f3a5}
jwt.expirationMs=86400000

# Server Port
server.port=${PORT:8765}

# DigitalOcean Spaces Config
do.spaces.endpoint=https://sfo3.digitaloceanspaces.com
do.spaces.region=sfo3
do.spaces.access-key=${DO_SPACES_ACCESS_KEY:DO00KVTXXT2HU4GJD9BP}
do.spaces.secret-key=${DO_SPACES_SECRET_KEY:eYibjDg1bHKW/a+1Y2r8Go3sozCxpRjm7/AfRDdkn1c}
do.spaces.bucket=viewowebapplicationbackend

# Allow large media uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB